        Maps products to assortments and customer segments. It stores lifecycle expectations,
        product rankings, newness classification, segmentation, key looks, and assortment
        metadata such as name and type. Each entry links to a specific product and
        customer, enabling analysis of assortment composition and its alignment with
        customer profiles and product attributes.
